version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: ../Dockerfile.server
    container_name: pulseops-server
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=pulseops_production_secret_key_2026
    volumes:
      - pulseops_data:/app

  client:
    build:
      context: ./client
      dockerfile: ../Dockerfile.client
    container_name: pulseops-client
    ports:
      - "3000:80"
    depends_on:
      - server

volumes:
  pulseops_data:
